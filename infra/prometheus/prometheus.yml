global: { scrape_interval: 15s, evaluation_interval: 30s }
scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - tenant-service:8000
          - crm-service:8000
          - campaign-service:8000
          - call-service:8000
          - voice-service:8000
          - ai-agent-service:8000
          - ai-gateway:8000
          - mcp-registry:8000
          - tool-execution:8000
          - booking-service:8000
          - email-service:8000
          - email-inbox-service:8000
          - integration-service:8000
          - notification-service:8000
          - analytics-service:8000
          - audit-service:8000
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8080"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
