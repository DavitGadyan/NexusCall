workers:
- name: worker-imports
  owner: crm-service
  command:
  - celery
  - -A
  - crm_service.worker
  - worker
  - -Q
  - imports.process
  - --concurrency
  - '2'
  - --without-heartbeat
  - --without-gossip
  - --without-mingle
  queues:
  - imports.process
  profiles:
  - crm
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  terminationGracePeriodSeconds: 330
  env: {}
  secretEnv: {}
- name: worker-campaign
  owner: campaign-service
  command:
  - celery
  - -A
  - campaign_service.worker
  - worker
  - -Q
  - calls.schedule
  - --concurrency
  - '2'
  - --without-heartbeat
  - --without-gossip
  - --without-mingle
  queues:
  - calls.schedule
  profiles:
  - crm
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
