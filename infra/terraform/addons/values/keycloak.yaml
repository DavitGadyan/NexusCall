# Keycloak 26 (quarkus) through the codecentric keycloakx chart.
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
http:
  relativePath: "/"
database:
  vendor: postgres
  hostname: nexus-pg-rw.nexus-data.svc
  port: 5432
  database: keycloak
  existingSecret: keycloak-db-credentials
  existingSecretKey: password
  username: keycloak
cache:
  stack: kubernetes
proxy:
  enabled: true
  mode: xforwarded
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 1536Mi }
podDisruptionBudget:
  maxUnavailable: 1
serviceMonitor:
  enabled: true
