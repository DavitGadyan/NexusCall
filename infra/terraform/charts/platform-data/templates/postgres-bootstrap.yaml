{{- /*
Idempotent role and database bootstrap: the production counterpart of infra/postgres/init/01-databases.sh.
Per service database `<db>`:
  <db>_owner      LOGIN, owns the schema; password rotated by Vault (static role) and used only by migrations
  <db>_app        NOLOGIN group: NOSUPERUSER NOBYPASSRLS; per-table DML grants come from the migrations.
                  Vault issues short-lived LOGIN members of it (`database/creds/<db>-app`)
  <db>_inspector  NOLOGIN group for the RLS coverage dashboard (catalog read only)
  <db>_platform   NOLOGIN group for the audited break-glass path
vault_admin receives ADMIN on these roles (not INHERIT, not SET), so it can manage membership and rotate
passwords without being able to read tenant data.
*/ -}}
{{- $p := .Values.postgres -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $p.name }}-bootstrap-sql
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  bootstrap.sql: |
    \set ON_ERROR_STOP on
    REVOKE ALL ON DATABASE postgres FROM PUBLIC;
    SELECT 'CREATE DATABASE keycloak OWNER keycloak'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak') \gexec
    {{- range $svc, $db := $p.databases }}
    -- {{ $svc }}
    DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $db }}_owner') THEN
        CREATE ROLE {{ $db }}_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $db }}_app') THEN
        CREATE ROLE {{ $db }}_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $db }}_inspector') THEN
        CREATE ROLE {{ $db }}_inspector NOLOGIN NOSUPERUSER NOBYPASSRLS;
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $db }}_platform') THEN
        CREATE ROLE {{ $db }}_platform NOLOGIN NOSUPERUSER NOBYPASSRLS;
      END IF;
    END $$;
    GRANT {{ $db }}_owner, {{ $db }}_app, {{ $db }}_inspector, {{ $db }}_platform TO vault_admin
      WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
    SELECT 'CREATE DATABASE {{ $db }} OWNER {{ $db }}_owner'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ $db }}') \gexec
    \connect {{ $db }}
    REVOKE ALL ON DATABASE {{ $db }} FROM PUBLIC;
    GRANT CONNECT ON DATABASE {{ $db }} TO {{ $db }}_app, {{ $db }}_inspector, {{ $db }}_platform;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    ALTER SCHEMA public OWNER TO {{ $db }}_owner;
    GRANT USAGE ON SCHEMA public TO {{ $db }}_app, {{ $db }}_inspector, {{ $db }}_platform;
    ALTER DEFAULT PRIVILEGES FOR ROLE {{ $db }}_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO {{ $db }}_app;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    {{- if eq $db "agent" }}
    CREATE EXTENSION IF NOT EXISTS vector;
    {{- end }}
    \connect postgres
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $p.name }}-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: psql
          image: {{ $p.bootstrapImage | default $p.imageName }}
          command: ["/bin/sh", "-c"]
          args:
            - until pg_isready -q; do sleep 5; done; exec psql -v ON_ERROR_STOP=1 -f /sql/bootstrap.sql
          env:
            - { name: PGHOST, value: {{ printf "%s-rw" $p.name }} }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ $p.name }}-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ $p.name }}-superuser, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: sql, mountPath: /sql, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: sql
          configMap: { name: {{ $p.name }}-bootstrap-sql }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
