[project]
name = "nexus-tool-execution"
version = "0.1.0"
description = "NexusCall Tool Execution Service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nexus-core",
  "nexus-event-schemas",
  "nexus-provider-contracts",
  "jsonschema>=4.23,<5",
  # Used directly by the pinned MCP transport (already in the lock via nexus-core).
  "httpx>=0.28,<0.29",
  "httpcore>=1.0.9,<2",
  "certifi>=2024.2.2",
]

[tool.uv.sources]
nexus-core = { workspace = true }
nexus-event-schemas = { workspace = true }
nexus-provider-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool_execution"]
