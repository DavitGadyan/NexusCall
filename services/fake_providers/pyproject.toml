[project]
name = "nexus-fake-providers"
version = "0.1.0"
description = "DEVELOPMENT/TEST ONLY deterministic simulators for Twilio, SES/SNS, Anthropic, Deepgram, ElevenLabs, Google Calendar."
requires-python = ">=3.12,<3.13"
dependencies = ["nexus-core", "nexus-provider-contracts", "websockets>=13,<16"]

[tool.uv.sources]
nexus-core = { workspace = true }
nexus-provider-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_providers"]
