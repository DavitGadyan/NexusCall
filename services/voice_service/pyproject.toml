[project]
name = "nexus-voice-service"
version = "0.1.0"
description = "NexusCall Voice / Conversation Service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nexus-core[aws]",
  "nexus-event-schemas",
  "nexus-provider-contracts",
]

[tool.uv.sources]
nexus-core = { workspace = true }
nexus-event-schemas = { workspace = true }
nexus-provider-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_service"]
