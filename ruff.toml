line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/versions/*.py.tmpl"]

[lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "S101", "RUF012", "PLR0911", "B008", "PLC0415", "N818", "RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "PLR2004", "S311"]
"**/migrations/**" = ["E501", "N999", "INP001"]
"scripts/**" = ["S603", "S607", "T201", "PLR0915", "E501", "S108"]
"packages/nexus_core/nexus_core/app.py" = ["PLR0915"]
"**/tables.py" = ["E501", "S608"]
# Identifier-validated DDL builders (see _check()) and migrations are the only places allowed to build SQL strings.
"packages/nexus_core/nexus_core/rls.py" = ["S608"]
"**/migrations/versions/*.py" = ["E501", "S608"]

[lint.isort]
known-first-party = ["nexus_core", "nexus_events", "nexus_providers", "fake_providers", "tenant_service", "crm_service",
  "campaign_service", "call_service", "voice_service", "ai_agent_service", "ai_gateway", "mcp_registry",
  "tool_execution", "booking_service", "email_service", "email_inbox_service", "integration_service",
  "notification_service", "analytics_service", "audit_service"]
