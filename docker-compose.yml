# GENERATED by scripts/gen_compose.py — DEVELOPMENT ONLY. Do not edit by hand.
# All host ports bind to 127.0.0.1. Production uses Helm (infra/helm) with Vault Agent,
# NetworkPolicies and managed secrets; nothing here is production configuration.
name: nexuscall
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: postgres
      NEXUS_DB_DEV_PASSWORD: ${NEXUS_DB_DEV_PASSWORD}
    command:
    - postgres
    - -c
    - max_connections=400
    - -c
    - shared_buffers=256MB
    - -c
    - log_min_duration_statement=500
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
    - 127.0.0.1:${NEXUS_PORT_POSTGRES:-47432}:5432
    networks:
    - internal
    mem_limit: 1g
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U nexus_bootstrap -d audit
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${NEXUS_REDIS_DEV_PASSWORD}
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - volatile-lru
    - --appendonly
    - 'no'
    networks:
    - internal
    mem_limit: 192m
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$NEXUS_REDIS_DEV_PASSWORD" --no-auth-warning ping
      interval: 5s
      retries: 20
    environment:
      NEXUS_REDIS_DEV_PASSWORD: ${NEXUS_REDIS_DEV_PASSWORD}
  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
    - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    - rabbitdata:/var/lib/rabbitmq
    ports:
    - 127.0.0.1:${NEXUS_PORT_RABBITMQ_UI:-47672}:15672
    networks:
    - internal
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 30
  rabbitmq-bootstrap:
    image: nexuscall/tools:dev
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    command:
    - scripts/bootstrap_rabbitmq.py
    env_file:
    - .env
    environment:
      RABBITMQ_API: http://rabbitmq:15672/api
    networks:
    - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: 'no'
  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    cap_add:
    - IPC_LOCK
    command:
    - server
    - -dev
    - -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      SKIP_SETCAP: 'true'
    ports:
    - 127.0.0.1:${NEXUS_PORT_VAULT:-47200}:8200
    networks:
    - internal
    mem_limit: 256m
    healthcheck:
      test:
      - CMD
      - vault
      - status
      - -address=http://127.0.0.1:8200
      interval: 5s
      retries: 20
  vault-bootstrap:
    image: hashicorp/vault:1.18.3
    entrypoint:
    - /bin/sh
    - /bootstrap.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      ENV: ${ENV:-development}
    volumes:
    - ./infra/vault/bootstrap.sh:/bootstrap.sh:ro
    - approle:/approle
    user: 0:0
    networks:
    - internal
    depends_on:
      vault:
        condition: service_healthy
    restart: 'no'
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command:
    - start-dev
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${NEXUS_DB_DEV_PASSWORD}
      KC_HOSTNAME: ${NEXUS_OIDC_PUBLIC_BASE}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DEV_USER_PASSWORD: ${KC_DEV_USER_PASSWORD}
      KC_DEV_SERVICE_CLIENT_SECRET: ${KC_DEV_SERVICE_CLIENT_SECRET}
      KC_WEB_BFF_CLIENT_SECRET: ${KC_WEB_BFF_CLIENT_SECRET}
      NEXUS_WEB_ORIGIN: ${NEXUS_PUBLIC_BASE_URL}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
    volumes:
    - ./infra/keycloak/realm-nexus.json:/opt/keycloak/data/import/realm-nexus.json:ro
    ports:
    - 127.0.0.1:${NEXUS_PORT_KEYCLOAK:-47080}:8080
    networks:
    - internal
    mem_limit: 900m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep
        -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
  objectstore:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - printf '{"identities":[{"name":"nexus","credentials":[{"accessKey":"%s",''"secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
      "$$S3_DEV_ACCESS_KEY" "$$S3_DEV_SECRET_KEY" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256
      -volume.max=8 -ip.bind=0.0.0.0
    environment:
      S3_DEV_ACCESS_KEY: ${S3_DEV_ACCESS_KEY}
      S3_DEV_SECRET_KEY: ${S3_DEV_SECRET_KEY}
    volumes:
    - objectdata:/data
    ports:
    - 127.0.0.1:${NEXUS_PORT_S3:-47900}:9000
    networks:
    - internal
    mem_limit: 384m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1
      interval: 5s
      retries: 30
  objectstore-init:
    image: amazon/aws-cli:2.22.20
    entrypoint:
    - /bin/sh
    - -c
    - for b in recordings transcripts attachments raw-mail imports exports knowledge; do aws --endpoint-url http://objectstore:9000 s3api head-bucket
      --bucket $$b 2>/dev/null || aws --endpoint-url http://objectstore:9000 s3api create-bucket --bucket $$b; done
    environment:
      AWS_ACCESS_KEY_ID: ${S3_DEV_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_DEV_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    networks:
    - internal
    depends_on:
      objectstore:
        condition: service_healthy
    restart: 'no'
  migrate:
    image: nexuscall/tools:dev
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    command:
    - scripts/migrate_all.py
    environment:
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_PASSWORD: ${NEXUS_DB_DEV_PASSWORD}
    networks:
    - internal
    depends_on:
