    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=64m
    - /srv/apps/web/.next/cache:size=64m,uid=10001
    profiles:
    - core
    env_file:
    - .env
    environment:
      NEXUS_OIDC_INTERNAL_BASE: http://keycloak:8080/realms/nexus
      REDIS_URL: redis://:${NEXUS_REDIS_DEV_PASSWORD}@redis:6379/1
      SVC_TENANT_SERVICE_URL: http://tenant-service:8000
