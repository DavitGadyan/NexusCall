[project]
name = "nexus-provider-contracts"
version = "0.1.0"
description = "Provider adapter Protocols (telephony, email, LLM, STT, TTS, calendar, CRM) + reusable contract test suites."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_providers"]
