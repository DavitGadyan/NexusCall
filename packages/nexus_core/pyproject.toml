[project]
name = "nexus-core"
version = "0.1.0"
description = "NexusCall shared infrastructure: config, logging, auth, RLS sessions, outbox/inbox, idempotency, Vault, webhooks."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<2",
  "httpx>=0.28,<0.29",
  "pyjwt[crypto]>=2.10,<3",
  "cryptography>=43,<46",
  "redis>=5.2,<6",
  "celery>=5.4,<6",
  "aio-pika>=9.5,<10",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "nexus-event-schemas",
]

[project.optional-dependencies]
# S3-compatible object storage + SES. Services that need them depend on `nexus-core[aws]`.
aws = ["aiobotocore>=2.15,<4"]

[tool.uv.sources]
nexus-event-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_core"]
